# DigitalOcean App Platform Configuration
name: luxence
region: nyc

# Configurações de build
build_command: npm run build

# Variáveis de ambiente para build
envs:
  - key: NODE_OPTIONS
    value: "--max-old-space-size=4096"
    scope: BUILD_TIME
  - key: NODE_ENV
    value: production
    scope: RUN_AND_BUILD_TIME

# Serviços
services:
  - name: web
    github:
      branch: main
      deploy_on_push: true
    
    # Configurações de build
    build_command: npm run build
    
    # Comando de start
    run_command: npm start
    
    # Recursos
    instance_count: 1
    instance_size_slug: professional-xs  # 1GB RAM, 1 vCPU
    
    # Health check
    health_check:
      http_path: /api/health
      initial_delay_seconds: 30
      period_seconds: 10
      timeout_seconds: 5
      success_threshold: 1
      failure_threshold: 3
    
    # Rotas
    routes:
      - path: /
    
    # Variáveis de ambiente (adicione via dashboard)
    # DATABASE_URL, AUTH_SECRET, etc.

# Database (se usar managed database)
databases:
  - name: luxence-db
    engine: MYSQL
    version: "8"
